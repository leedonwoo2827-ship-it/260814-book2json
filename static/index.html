<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>작가 에이전트</title>
<meta name="description" content="단행본 PDF 를 넣으면 발표 쇼케이스가 그대로 먹는 이론 요약 HTML 한 장이 나오는 로컬 콘솔" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f6b66'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E%EC%B1%85%3C/text%3E%3C/svg%3E" />
<!-- app.css 는 260812-summary-shocase 에서 그대로 가져온 것(브랜드 색 여섯 줄만 갈았다),
     pages.css 는 이 앱에서 더한 화면. 파일로 갈라 두어야 나중에 저쪽 디자인이
     바뀌었을 때 어디까지가 가져온 것인지 알 수 있다. -->
<link rel="stylesheet" href="/static/css/app.css" />
<link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body>
<!-- ══ Layer 0 — 베이스 (좌측 레일 + 작업 본문) ══════════════════════════
     xam-local 의 UX 법칙을 그대로 따른다: **목록은 패널(위층), 작업은 바탕(아래층).**
     패널을 열고 닫아도 바탕은 언마운트되지 않는다 — 그래서 긴 스테이지의 SSE 스트림과
     원고 편집기의 미저장 텍스트가 산다. 미저장 텍스트를 가진 화면은 패널에 두지 않는다. -->
<div class="app">
  <nav class="rail" id="rail" aria-label="주 메뉴">
    <div class="side-brand">
      <!-- ★ 앞의 칩이 **유형** 자리다. 색이 들어가는 칸은 여기 하나뿐이라,
           흐름("단행본 → 원고")이 아니라 **무엇을 읽는 에이전트인가**를 적는다. -->
      <button class="brand-mark" id="brand-mark" type="button" title="메뉴 펼치기">단행본</button>
      <span class="brand-name">작가 에이전트</span>
      <button class="rail-toggle" id="rail-toggle" type="button"
              title="메뉴 접기 (Ctrl+B)" aria-label="메뉴 접기">
        <span data-icon="panelLeft" data-icon-size="16"></span>
      </button>
    </div>

    <!-- ★ 맨 위 큰 단추는 **새로 시작하는 자리**다(2026-08-14 지시).
         예전에는 「다음 할 일」이 있었는데, 눌러 봐야 현황판으로 갈 뿐이라
         "다음이 무엇인지 알려 준다" 는 이름값을 못 했다. 무엇이 남았는지는
         오른쪽 서랍(최근 한 일)이 번호까지 붙여 말해 주므로 그 일이 겹치기도
         한다. 여기는 **시작**만 맡는다 — 목록의 다른 줄들과 성격이 다르니
         모양도 다른 게 맞다. -->
    <button class="btn-new" id="btn-new-deck" type="button"
            title="새 원고 — 책이 어디 있는지 넣기">
      <span data-icon="plus" data-icon-size="15"></span>
      <span>새 원고</span>
    </button>

    <ul class="side-nav" id="side-nav">
      <!-- 화면 이름(프레임·대본·영상)은 파이프라인 용어라 버렸다.
           그 자리에 **유형**이 뜬다 — 유형은 프로젝트마다 다르고, 유형이 곧
           어느 도구로 갈지 정한다(움직이는 화면 → 영상 편집기, 나머지 → 덱).
           ★ 「새 발표」 줄은 뺐다 — 바로 위 큰 단추가 같은 곳으로 간다.
              같은 것이 두 개면 어느 쪽이 진짜인지 매번 생각하게 된다. -->
      <li><a href="#/board" data-nav="brd" title="현황판 — 무엇이 얼마나 만들어졌나">
        <span data-icon="layers"></span><span>현황판 <em class="nav-dest">무엇이 남았나</em></span></a></li>
      <!-- 목차 확인이 **가장 앞**이다. h3 하나가 슬라이드 한 장이라, 여기서 정한
           장 수가 곧 발표의 장 수다. 확정한 뒤에 비싼 단계가 돈다 — 순서가 곧
           규칙이라 메뉴 순서도 그렇게 둔다. -->
      <li><a href="#/outline" data-nav="otl" title="목차 — 장 순서와 제목을 확정">
        <span data-icon="list"></span><span>목차 <em class="nav-dest">h3 하나 = 한 장</em></span></a></li>
      <li><a href="#/draft" data-nav="drf" title="원고 — 장별 몸통을 944×507 자 위에서">
        <span data-icon="file"></span><span>원고 <em class="nav-dest">몸통 · 실측</em></span></a></li>
      <!-- ★ 「이미지 프롬프트」 칸이 있었다. 2026-08-14 에 뺐다 — 그림 지시는
           **다른 에이전트가 만든다.** 이 앱이 내는 것은 원고와 대본까지다.
           화면 코드(static/js/image.js)는 지우지 않고 길만 끊었다. -->
    </ul>

    <!-- ★ 쇼케이스에 있던 「수정 — 유형」 레인은 없다. 저기서 유형은 그림이
         어디서 오는가(캡처·영상·없음)였는데, 여기 원고는 전부 글이라 갈릴 축이
         없다. 자리를 비워 두는 대신 지웠다 — 늘 비어 있는 칸은 눈이 배운다. -->

    <ul class="side-nav side-nav-tail">
      <li><a href="#/export" data-nav="exp" title="내보내기 — 원고 HTML · 대본">
        <span data-icon="download"></span><span>내보내기 <em class="nav-dest">원고 · 대본</em></span></a></li>
    </ul>

    <!-- 스테이지 하나가 몇 분씩 간다. 그 화면을 지키고 있을 수 없으니, 어느 화면에
         있어도 여기서 보인다. 돌고 있지 않으면 통째로 숨는다. -->
    <a class="render-bar" id="render-bar" href="#/board" hidden>
      <span class="render-bar-top">
        <span id="render-bar-title">스테이지</span>
        <span class="render-bar-pct" id="render-bar-pct"></span>
      </span>
      <span class="render-bar-track"><span class="render-bar-fill" id="render-bar-fill"></span></span>
      <span class="render-bar-msg" id="render-bar-msg"></span>
    </a>

    <div class="side-section">
      <span class="side-section-title" id="side-section-title">최근 원고</span>
      <button class="side-section-more" id="side-section-more" type="button"
              data-go="/projects">전체</button>
    </div>
    <div class="side-recent" id="side-recent">
      <div class="side-empty">아직 원고가 없습니다.</div>
    </div>

    <div class="rail-wrap">
      <!-- 좌하단 칩 = 워크스페이스. 프로젝트 전환 · 산출물 폴더 · 연결 설정이 여기로. -->
      <button class="side-user" id="side-user" type="button"
              aria-haspopup="dialog" aria-expanded="false"
              title="워크스페이스 — 프로젝트 · 산출물 폴더 · 연결 설정">
        <span class="su-avatar" id="su-avatar">책</span>
        <span class="su-text">
          <span class="su-name" id="su-name">원고를 고르세요</span>
          <span class="su-team" id="su-team">—</span>
        </span>
        <span data-icon="chevronUp" data-icon-size="14"></span>
      </button>
    </div>
  </nav>

  <main class="content" id="view" tabindex="-1"></main>

  <!-- ══ 오른쪽 서랍 — 최근 한 일 ═══════════════════════════════════════════
       ★ 왼쪽이 아니라 오른쪽인 이유: 왼쪽 레일은 **어디로 갈까**(목록)이고
         이것은 **무엇을 했나**(이력)다. 성격이 달라서 같은 자리에 섞으면 둘 다
         안 읽힌다(2026-08-14 지시: "좌측은 목록이 있어서 그 위치가 아닌 것 같다").
       ★ 원고 화면만이 아니라 **전체 공통**이다 — 어느 화면에 있든 "방금 무엇을
         눌렀나 · 무엇을 다시 해야 하나" 는 같은 질문이다.
       ★ 접힌 상태가 기본이다. 늘 펴져 있으면 작업 폭을 상시로 먹는다. -->
  <aside class="log-rail" id="log-rail" data-open="0" aria-label="최근 한 일">
    <button class="log-tab" id="log-tab" type="button"
            title="최근 한 일 (Ctrl+J)" aria-expanded="false">
      <span data-icon="clock" data-icon-size="15"></span>
      <span class="log-tab-t">최근 한 일</span>
      <span class="log-tab-dot" id="log-tab-dot" hidden></span>
    </button>
    <div class="log-body" id="log-body"></div>
  </aside>
</div>

<!-- ══ Layer 1 — 부유 패널 (목록 = 고르는 곳). panel.js 가 만든다. ══════════ -->
<div class="panel-layer" id="panel-layer" hidden></div>

<!-- ══ Layer 2 — 토스트 ═══════════════════════════════════════════════════ -->
<div class="toast" id="toast" hidden></div>

<script type="module" src="/static/js/shell.js"></script>
</body>
</html>
