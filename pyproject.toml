[project]
name = "book-agent"
version = "0.1.0"
description = "책 원고 에이전트 — 단행본 PDF 를 발표 쇼케이스가 먹는 이론 요약 HTML 한 장으로"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "claude-agent-sdk>=0.2.130",
  "pydantic>=2.6",
  "PyMuPDF>=1.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "llm", "pipeline", "render"]
